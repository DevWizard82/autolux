<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autolux - Login</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/login-B98hVShf.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/assets/toast-Cexsccug.js">
    <link rel="stylesheet" crossorigin href="/assets/toast-BfMlxmOj.css">
    <link rel="stylesheet" crossorigin href="/assets/login-BYS38K3W.css">
  </head>
  <body>
    <div class="login-wrapper">
      <form id="login-form" class="login-card">
        <h1 class="brand">AUTOLUX</h1>
        <h2 class="title">Welcome back</h2>
        <p class="subititle">Sign in to continue</p>

        <div class="input-group">
          <input type="email" id="email" required />
          <label for="email">Email</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" required />
          <label for="password">Password</label>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p class="switch-auth">
          Don't have an account ?
          <a href="register.html">Create one</a>
        </p>

        <p id="error-msg" class="error-msg"></p>
      </form>
    </div>

  </body>
</html>
