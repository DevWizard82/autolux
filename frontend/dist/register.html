<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autolux - Register</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="module" crossorigin src="/assets/register-Crq0BTRT.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/assets/toast-Cexsccug.js">
    <link rel="stylesheet" crossorigin href="/assets/toast-BfMlxmOj.css">
    <link rel="stylesheet" crossorigin href="/assets/login-BYS38K3W.css">
  </head>
  <body>
    <div class="login-wrapper">
      <form id="register-form" class="login-card">
        <h1 class="brand">AUTOLUX</h1>
        <h2 class="title">Create account</h2>
        <p class="subtitle">Join the luxury experience</p>

        <div class="input-group">
          <input type="text" id="first_name" required />
          <label>First name</label>
        </div>

        <div class="input-group">
          <input type="text" id="last_name" required />
          <label>Last name</label>
        </div>

        <div class="input-group">
          <input type="tel" id="phone" required />
          <label>Phone number</label>
        </div>

        <div class="input-group">
          <input type="text" id="email" required />
          <label>Email</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" required />
          <label>Password</label>
        </div>

        <button type="submit" class="login-btn">Register</button>

        <p class="switch-auth">
          Already have an account ?
          <a href="login.html">Login</a>
        </p>

        <p id="error-msg" class="error-msg"></p>
      </form>
    </div>
  </body>
</html>
